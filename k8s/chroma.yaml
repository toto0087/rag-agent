apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          command: ["chroma"]
          args: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/data"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: datos
              mountPath: /data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: chroma-data
